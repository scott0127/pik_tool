services:
  - type: web
    name: pik_tool
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: TILE_STATS_DISABLED
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
