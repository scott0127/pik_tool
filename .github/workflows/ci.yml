name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # public/data is ~237MB and this job never reads it; blob:none fetches
          # blobs on demand so the checkout stays small.
          filter: blob:none

      # Reads the pinned version from package.json packageManager
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs `nuxt prepare`, which generates .nuxt/ for vue-tsc
      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const row = (n, m) => `| ${n} | ${m.pct}% | ${m.covered}/${m.total} |`;
            console.log("## Coverage (app/composables, app/constants)\n");
            console.log("| Metric | % | Covered |");
            console.log("| --- | --- | --- |");
            console.log(row("Lines", s.lines));
            console.log(row("Statements", s.statements));
            console.log(row("Branches", s.branches));
            console.log(row("Functions", s.functions));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Type check
        # 11 pre-existing errors in HeroSection.vue and HeroSettingsModal.vue.
        # Drop continue-on-error once those are fixed so this gates too.
        continue-on-error: true
        run: pnpm typecheck
